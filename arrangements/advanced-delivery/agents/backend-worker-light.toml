description = "Implement a small backend change or maintenance chore when owner, behavior, files, and validation are already clear: one handler, adapter, rule, or rename on an existing pattern. Deliver the diff and its test. Broader work goes to backend-worker; coupled invariants go to hard-task-specialist."
